    <g><circle cx="256" cy="404" r="20" fill="#142539" stroke="#7c4dff" stroke-width="4"/><circle cx="256" cy="404" r="8" fill="#7c4dff"/></g>
    <g><circle cx="108" cy="256" r="20" fill="#142539" stroke="#54f4ff" stroke-width="4"/><circle cx="108" cy="256" r="8" fill="#54f4ff"/></g>
    <g><circle cx="404" cy="256" r="20" fill="#142539" stroke="#00c8ff" stroke-width="4"/><circle cx="404" cy="256" r="8" fill="#00c8ff"/></g>
    <g><circle cx="151" cy="151" r="16" fill="#142539" stroke="#00c8ff" stroke-width="4"/><circle cx="151" cy="151" r="6.5" fill="#00c8ff"/></g>
