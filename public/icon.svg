    <g><circle cx="151" cy="361" r="16" fill="#142539" stroke="#54f4ff" stroke-width="4"/><circle cx="151" cy="361" r="6.5" fill="#54f4ff"/></g>
    <g><circle cx="361" cy="361" r="16" fill="#142539" stroke="#00c8ff" stroke-width="4"/><circle cx="361" cy="361" r="6.5" fill="#00c8ff"/></g>
  </g>
  <g filter="url(#softGlow)">
