    <circle cx="256" cy="256" r="150"/><circle cx="256" cy="256" r="108"/>
  </g>
  <g stroke="url(#lineGrad)" stroke-width="10" stroke-linecap="round" opacity="0.96" filter="url(#softGlow)">
