<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SYNAPTIK icon</title>
  <desc id="desc">Futuristic neural icon for SYNAPTIK, with a central S connected to luminous cyan, blue and violet nodes.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#11102a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#54f4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#54f4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54f4ff"/>
      <stop offset="50%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="nodeBlur"/>
      <feMerge><feMergeNode in="nodeBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="#243040" stroke-width="4"/>
  <circle cx="256" cy="256" r="176" fill="url(#glowGrad)"/>
